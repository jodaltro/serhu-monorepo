<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SerHu — Synthetic Being</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Three.js canvas fills the viewport -->
  <div id="canvas-container"></div>

  <!-- Chat overlay -->
  <div id="chat-panel">
    <div id="chat-header">
      <span id="being-name">SerHu</span>
      <span id="being-stage" class="badge">sensorimotor</span>
      <button id="copy-id-btn" title="Copy Being ID">⎘</button>
      <button id="sleep-btn" title="Trigger sleep cycle (consolidate + dream)">💤</button>
    </div>
    <div id="chat-messages"></div>
    <form id="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Speak to the Being…"
        autocomplete="off"
      />
      <button type="submit">↵</button>
    </form>
  </div>

  <!-- Setup overlay (shown on first load) -->
  <div id="setup-overlay">
    <div id="setup-card">
      <div id="setup-tabs">
        <button class="tab active" data-tab="create">New Being</button>
        <button class="tab" data-tab="load">Load Existing</button>
      </div>

      <!-- Create tab -->
      <div id="tab-create" class="tab-panel">
        <form id="setup-form">
          <label for="being-name-input">Name</label>
          <input id="being-name-input" type="text" placeholder="Luna" required />
          <label for="language-select">Language</label>
          <select id="language-select">
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
          </select>
          <button type="submit">Give birth ✦</button>
        </form>
      </div>

      <!-- Load tab -->
      <div id="tab-load" class="tab-panel hidden">
        <form id="load-form">
          <label for="being-id-input">Being ID</label>
          <input id="being-id-input" type="text" placeholder="Paste the Being ID…" required />
          <button type="submit">Connect ↗</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
