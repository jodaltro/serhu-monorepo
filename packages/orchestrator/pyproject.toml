[project]
name = "serhu-orchestrator"
version = "0.1.0"
description = "SerHu Orchestration Layer - The Brain (MemGPT-like memory OS for AI)"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.13.3",
    "supabase>=2.15.1",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
