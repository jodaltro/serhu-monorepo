[project]
name = "serhu-morphogenesis"
version = "0.1.0"
description = "SerHu Visual Morphogenesis Engine - Personality to Visual Transformation"
requires-python = ">=3.11"
dependencies = [
    "serhu-orchestrator",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
