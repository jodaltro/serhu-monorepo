[project]
name = "serhu-monorepo"
version = "0.1.0"
description = "SerHu - Synthetic Being Ontogenesis Monorepo"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["packages/orchestrator/tests"]
