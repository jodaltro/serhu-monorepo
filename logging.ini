[loggers]
keys=root,serhu_api,serhu_orchestrator,serhu_morphogenesis,serhu_grpc

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=detailedFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_serhu_api]
level=INFO
handlers=consoleHandler,fileHandler
qualname=serhu_api
propagate=0

[logger_serhu_orchestrator]
level=INFO
handlers=consoleHandler,fileHandler
qualname=serhu_orchestrator
propagate=0

[logger_serhu_morphogenesis]
level=INFO
handlers=consoleHandler,fileHandler
qualname=serhu_morphogenesis
propagate=0

[logger_serhu_grpc]
level=INFO
handlers=consoleHandler,fileHandler
qualname=serhu_grpc
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=detailedFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=detailedFormatter
args=('serhu.log', 'a', 'utf-8')

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
